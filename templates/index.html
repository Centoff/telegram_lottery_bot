<!DOCTYPE html>
<html>
<head>
    <title>Telegram Lottery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { 
            font-family: Arial; 
            padding: 20px; 
            background: #f5f5f5;
        }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        .btn { padding: 12px 20px; margin: 10px 5px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px; width: 100%; }
        .channel { margin: 10px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .stats { display: flex; justify-content: space-around; margin: 20px 0; }
        .stat-card { text-align: center; padding: 10px; background: #e9ecef; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Telegram Lottery</h1>
        
        <div class="channel">
            <h3>Подписаться на каналы:</h3>
            <p>@channel1</p>
            <p>@channel2</p>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <h3>👥 1567</h3>
                <p>Пользователей</p>
            </div>
            <div class="stat-card">
                <h3>🎲 3</h3>
                <p>Активных розыгрышей</p>
            </div>
        </div>
        
        <button onclick="joinLottery()" class="btn">Участвовать в розыгрыше</button>
        <button onclick="getHistory()" class="btn">История розыгрышей</button>
        <button onclick="getUserStats()" class="btn">Моя статистика</button>

        <script>
            function joinLottery() {
                alert("Вы участвуете в розыгрыше!");
                // Здесь можно вызвать Telegram WebApp метод
            }

            function getHistory() {
                fetch('/api/lottery')
                    .then(response => response.json())
                    .then(data => {
                        alert(`Приз: ${data.prize}\nПользователей: ${data.users_online}`);
                    });
            }

            function getUserStats() {
                fetch('/api/user/123456789')
                    .then(response => response.json())
                    .then(data => {
                        alert(`Участий: ${data.joins}\nПобед: ${data.wins}`);
                    });
            }
        </script>
    </div>
</body>
</html>
